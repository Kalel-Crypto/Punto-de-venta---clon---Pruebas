name: Java Pruebas

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cajita
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Ayudame Dios
        uses: actions/checkout@v5

      - name: Jesucristo eres grande
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Prueba porfavor
        run: mvn test
      - name: Alabado sea nuestro señor
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar aplicación
        if: always()
        run: mvn clean package -DskipTests
      
      - name: Instalar Tomcat 11
        if: always()
        run: |
          wget -q https://downloads.apache.org/tomcat/tomcat-11/v11.0.26/bin/apache-tomcat-11.0.26.tar.gz
          tar -xzf apache-tomcat-11.0.26.tar.gz
          mv apache-tomcat-11.0.26 tomcat
      
      - name: Desplegar aplicación en Tomcat
        if: always()
        run: |
          cp vista/target/*.war tomcat/webapps/vista.war
      
      - name: Iniciar Tomcat
        if: always()
        run: |
          ./tomcat/bin/startup.sh
          sleep 15  
          
      - name: Newman
        if: always()
        run: npm install -g newman

      - name: Postmin
        if: always()
        run: newman run Postman/PuntoDeVenta.json \
          -r cli,junit \
          --reporter-junit-export Postman/Reporte-JUnit/newman-results.xml

      - name: Buscar reportes de Maven
        if: always()
        run: |
          echo "=== Archivos target ==="
          find . -type d -name target -print

          echo "=== Archivos de reporte ==="
          find . -type f \( -name "*.xml" -o -name "*.txt" \) | grep -E "surefire|test" || true

          echo "=== Contenido de target ==="
          find . -type f -path "*/target/*" | head -100

      - name: Generar reporte JUnit
        if: always()
        run: |
          mkdir -p Postman/Reporte-JUnit
          find . -path "*/target/surefire-reports/*" -type f -exec cp {} Postman/Reporte-JUnit/ \;

      - name: Subir reporte JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-JUnit
          path: Postman/Reporte-JUnit/